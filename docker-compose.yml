services:
  cite:
    build: .
    image: cite-checker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # the ONLY way out of the internal network; proxy allow-lists by hostname
      - HTTPS_PROXY=http://egress-proxy:3128
      - HTTP_PROXY=http://egress-proxy:3128
      - CITE_BULK_DB=/data/cl.db      # local CourtListener index (cite/bulk.py); API is the fallback
      - CITE_BULK_TEXT_DB=/text/cl-text.db   # opinion text store; on the VM this is local NVMe (HDD block storage is too slow for index reads)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65534:65534"
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - cache:/cache
      - ${CITE_DATA_DIR:-/opt/cite/data}:/data:ro
      - ${CITE_TEXT_DIR:-/opt/cite/data}:/text:ro
    networks: [cite-net]
    expose: ["8120"]

  egress-proxy:
    build: deploy/egress-proxy
    image: cite-egress-proxy:latest
    restart: unless-stopped
    environment:
      - EGRESS_ALLOW=courtlistener.com,www.courtlistener.com,api.vultrinference.com
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    networks: [cite-net, public]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [cite-net, public]   # `public` carries ACME/Let's Encrypt
    depends_on: [cite]

networks:
  cite-net:
    # INTERNAL: the kernel gives this bridge no route off the host. The app can
    # reach caddy and the egress proxy, and nothing else on earth.
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-cite
  public:
    driver: bridge

volumes:
  cache:
  caddy_data:
  caddy_config:
